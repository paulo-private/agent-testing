name: SonarCloud Analysis

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Diagnose token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "=== Token shape ==="
          echo "Length: ${#SONAR_TOKEN}"
          echo "First 4 chars: ${SONAR_TOKEN:0:4}"
          echo ""
          echo "=== Test 1: Validate token ==="
          curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/authentication/validate"
          echo ""
          echo ""
          echo "=== Test 2: Whoami ==="
          curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/users/current" || echo "current user lookup failed"
          echo ""
          echo "=== Test 3: List projects in org ==="
          curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/projects/search?organization=paulo-private"
          echo ""
          echo "=== Test 4: Check specific project ==="
          curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/components/show?component=paulo-private_agent-testing"
          echo ""

      - name: Build
        run: mvn -B compile test-compile

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=paulo-private_agent-testing
            -Dsonar.organization=paulo-private
            -Dsonar.java.binaries=target/classes
            -Dsonar.java.test.binaries=target/test-classes
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
